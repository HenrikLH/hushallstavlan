name: Röktest och skärmbilder

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emu:
    name: UI ${{ matrix.ui }} / ${{ matrix.screen }} / ${{ matrix.theme }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        screen: [telefon, vagg]
        theme: [light, dark]
        ui: [2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Installera testverktyg
        run: npm install --no-save --package-lock=false playwright@1.62.1 pngjs@7.0.0
      - name: Installera Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/checkout@v6
        if: matrix.ui == 2
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: baseline
          persist-credentials: false
      - name: Kör alla flikar och funktionstester
        env:
          THEME: ${{ matrix.theme }}
          SCREEN: ${{ matrix.screen }}
          UI: ${{ matrix.ui }}
          REDUCED: ${{ matrix.ui == 3 && matrix.screen == 'telefon' && matrix.theme == 'dark' && '0' || '1' }}
        run: |
          export LS="$(node -e 'console.log(JSON.stringify({...process.env.UI==="3"?{ui:"3",dev:"1"}:process.env.UI==="4"?{ui:"4"}:{},...process.env.SCREEN==="vagg"?{wall:"1",me:""}:{}}))')"
          if [[ "$SCREEN" == "vagg" ]]; then export VP=1368x912; fi
          if [[ "$UI" == "2" ]]; then
            APP="$PWD/baseline" OUT="$PWD/verktyg/emu/baseline-shots" node verktyg/emu/run.js verktyg/emu/alla-flikar.js
          fi
          node verktyg/emu/run.js verktyg/emu/animationer.js
          if [[ "$UI" == "4" ]]; then
            node verktyg/emu/run.js verktyg/emu/ui4.js
            node verktyg/emu/run.js verktyg/emu/ui4-installningar.js
            node verktyg/emu/run.js verktyg/emu/timerring.js
            node verktyg/emu/run.js verktyg/emu/hall-in-blad.js
          else
            # Standardanimationer provas i animationer.js och övriga funktionssviter.
            # Pixeljämförelsen kontrollerar det bevarade utseendet med animationer av.
            if [[ "$UI" == "2" ]]; then
              LS="$(node -e 'console.log(JSON.stringify({...JSON.parse(process.env.LS),motion:"0"}))')" node verktyg/emu/run.js verktyg/emu/ui-versioner.js
            else
              node verktyg/emu/run.js verktyg/emu/ui-versioner.js
            fi
          fi
          if [[ "$UI" == "2" ]]; then node verktyg/emu/jamfor-ui2.js; fi
          if [[ "$UI" == "2" ]]; then node verktyg/emu/run.js verktyg/emu/ui2-rymlig.js; fi
          node verktyg/emu/run.js verktyg/emu/anvandarfarger.js
          node verktyg/emu/recept-rpc.js
          node verktyg/emu/recept-server.js
          node verktyg/emu/run.js verktyg/emu/recept-ui.js
          node verktyg/emu/run.js verktyg/emu/recept-reliability.js
          node verktyg/emu/run.js verktyg/emu/recept-timeout.js
          node verktyg/emu/run.js verktyg/emu/plus-alternativ.js
          node verktyg/emu/run.js verktyg/emu/stad-plus.js
          NOW=2026-10-24T08:58:00+02:00 node verktyg/emu/run.js verktyg/emu/matsedel-gester.js
      - name: Spara skärmbilder
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: emu-ui${{ matrix.ui }}-${{ matrix.screen }}-${{ matrix.theme }}
          path: verktyg/emu/shots/
          if-no-files-found: warn
          retention-days: 7
