<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hushållstavlan</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hemma">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* ===== 1. Tokens (iOS systemfärger, se docs/ios-design.md) ===== */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-raised:#FFFFFF; --fill:rgba(118,118,128,.12);
  --ink:#000000; --ink-2:rgba(60,60,67,.6); --ink-3:rgba(60,60,67,.3); --line:rgba(60,60,67,.29);
  --accent:#A3253F; --accent-soft:rgba(163,37,63,.12); --on-accent:#FFFFFF;
  --red:#FF3B30; --orange:#FF9500; --green:#34C759; --gray:#8E8E93;
  --bar:rgba(249,249,249,.94); --track:#E5E5EA; --seg-on:#FFFFFF;
  --veg-bg:rgba(52,199,89,.15); --veg-ink:#248A3D; --meat-bg:rgba(162,132,94,.18); --meat-ink:#7A5C38; --gem-bg:rgba(255,149,0,.15); --gem-ink:#C93400;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --tabbar:49px; --side:260px; --navbar:44px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-raised:#2C2C2E; --fill:rgba(118,118,128,.24);
  --ink:#FFFFFF; --ink-2:rgba(235,235,245,.6); --ink-3:rgba(235,235,245,.3); --line:rgba(84,84,88,.65);
  --accent:#EC7088; --accent-soft:rgba(236,112,136,.22); --on-accent:#22090F;
  --red:#FF453A; --orange:#FF9F0A; --green:#30D158;
  --bar:rgba(22,22,24,.92); --track:#3A3A3C; --seg-on:#636366;
  --veg-ink:#30D158; --gem-ink:#FF9F0A; --meat-bg:rgba(172,142,104,.24); --meat-ink:#C8A57A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-raised:#2C2C2E; --fill:rgba(118,118,128,.24);
  --ink:#FFFFFF; --ink-2:rgba(235,235,245,.6); --ink-3:rgba(235,235,245,.3); --line:rgba(84,84,88,.65);
  --accent:#EC7088; --accent-soft:rgba(236,112,136,.22); --on-accent:#22090F;
  --red:#FF453A; --orange:#FF9F0A; --green:#30D158;
  --bar:rgba(22,22,24,.92); --track:#3A3A3C; --seg-on:#636366;
  --veg-ink:#30D158; --gem-ink:#FF9F0A; --meat-bg:rgba(172,142,104,.24); --meat-ink:#C8A57A; color-scheme:dark }

/* ===== 2. Bas och typografi ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:22px;letter-spacing:-.4px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0;margin:0;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.t1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px}
.t2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px}
.hl{font-size:17px;line-height:22px;font-weight:600}
.sub{font-size:15px;line-height:20px;letter-spacing:-.24px;color:var(--ink-2)}
.fn{font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--ink-2)}
.red{color:var(--red)}
button:active,.cell.link:active,[data-act]:active{opacity:.6}
.check:active,.sheet:active,.widget:active,input:active,select:active{opacity:1}
svg{flex:none}

/* ===== 3. Skal: flikrad (telefon) och sidofält (dator) ===== */
.nav{position:fixed;z-index:20;display:flex}
.nav button{display:flex;align-items:center;min-width:0;color:var(--gray)}
.nav .brand{display:none}
@media (max-width:899px){
  .nav{left:0;right:0;bottom:0;height:calc(var(--tabbar) + var(--sab));padding:0 var(--sar) var(--sab) var(--sal);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
  .nav button{flex:1;flex-direction:column;justify-content:flex-start;gap:2px;padding-top:6px;height:var(--tabbar);font-size:10px;line-height:12px;font-weight:600;letter-spacing:.1px}
  .nav button svg{width:25px;height:25px}
  .nav button[aria-current="page"]{color:var(--accent)}
}
@media (min-width:900px){
  .nav{top:0;bottom:0;left:0;width:calc(var(--side) + var(--sal));flex-direction:column;gap:2px;background:var(--bg);border-right:.5px solid var(--line);padding:calc(18px + var(--sat)) 12px 16px calc(12px + var(--sal))}
  .nav .brand{display:block;font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;padding:6px 10px 14px}
  .nav button{height:44px;gap:12px;padding:0 10px;border-radius:10px;color:var(--ink);font-size:17px}
  .nav button svg{width:22px;height:22px;color:var(--accent)}
  .nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
  .nav button[aria-current="page"] svg{color:var(--on-accent)}
  main{margin-left:calc(var(--side) + var(--sal))}
}
main{padding:0 var(--sar) 32px var(--sal);display:block}
@media (max-width:899px){main{padding-bottom:calc(var(--tabbar) + var(--sab) + 32px)}}
.wrap{max-width:1100px;margin:0 auto;padding-top:calc(var(--sat) + 10px)}
body.wall main{zoom:1.0588}

/* Kompakt rubrikrad (visas när den stora rubriken scrollats ur bild) */
.navbar{position:sticky;top:0;z-index:15;height:calc(var(--navbar) + var(--sat));margin-bottom:calc(-1 * (var(--navbar) + var(--sat)));padding-top:var(--sat);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);opacity:0;pointer-events:none;transition:opacity .15s ease}
.navbar.on{opacity:1;pointer-events:auto}
.navbar .nb{height:var(--navbar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;max-width:1100px;margin:0 auto}
.navbar .nb-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;text-align:center}
@media (prefers-reduced-motion:reduce){.navbar{transition:none}}

/* Vyrubrik */
.head{padding:0 16px;margin-bottom:6px}
.eyebrow{font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.08px;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.4px;min-width:0;overflow-wrap:anywhere}
.head .sub{margin-top:-2px}
.tools{display:flex;align-items:center;gap:4px;flex:none}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--accent);border-radius:22px}
.ib svg{width:24px;height:24px}
.ib.plus svg{width:26px;height:26px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;min-height:44px;padding:0 8px 0 4px;margin-left:-8px}
.back svg{width:13px;height:21px}
.navbar .back{margin-left:0}

/* ===== 4. Grupperade listor ===== */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 16px 6px 32px;margin-top:22px;font-size:13px;line-height:18px;letter-spacing:-.08px;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.sh .r{text-transform:none;font-variant-numeric:tabular-nums;flex:none}
.sh.red{color:var(--red)}
.sh .acc{color:var(--accent)}
.sh.sub2{margin-top:14px}
.group{background:var(--surface);border-radius:10px;margin:0 16px;overflow:hidden}
.group+.group{margin-top:12px}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;width:100%;text-align:left;color:var(--ink)}
.cell+.cell::before,.cell+.ingx::before,.ingx+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.cell.ck{gap:14px}
.cell.ck::before,.cell.lead::before{left:52px!important}
.grow{flex:1;min-width:0}
.title{overflow-wrap:anywhere}
.meta{font-size:15px;line-height:20px;letter-spacing:-.24px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:2px}
.val{font-size:17px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.chev{color:var(--ink-3);flex:none;display:flex}
.chev svg{width:8px;height:13px}
.cell.done .title{color:var(--ink-2)}
.cell.empty{color:var(--ink-2)}
.foot{padding:6px 32px 0;font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--ink-2)}
.cell.center{justify-content:center;text-align:center}
.cell.tight{padding-top:8px;padding-bottom:8px}

/* Bockar (som Påminnelser) – synlig cirkel 22px, tryckyta 44px */
.check{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:44px;margin:-11px;border:0;background:none;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.check::before{content:"";grid-area:1/1;width:22px;height:22px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--ink-3)}
.check:checked::before{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";grid-area:1/1;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check:focus-visible{outline:none}
.check:focus-visible::before{box-shadow:0 0 0 3px var(--accent-soft)}

/* Etiketter */
.chip{display:inline-flex;align-items:center;border-radius:6px;padding:1px 7px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:0;background:var(--fill);color:var(--ink-2);white-space:nowrap}
.chip.h{background:var(--accent-soft);color:var(--accent)}
.chip.v{background:var(--veg-bg);color:var(--veg-ink)}
.chip.k{background:var(--meat-bg);color:var(--meat-ink)}
.chip.g,.chip.offer{background:var(--gem-bg);color:var(--gem-ink)}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}

/* ===== 5. Knappar ===== */
.btn-fill,.btn-tint{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font-size:17px;font-weight:600;padding:0 20px}
.btn-fill{background:var(--accent);color:var(--on-accent)}
.btn-tint{background:var(--accent-soft);color:var(--accent)}
.btn-fill svg,.btn-tint svg{width:18px;height:18px}
.block{margin:16px 16px 0}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 14px;border-radius:17px;background:var(--accent-soft);color:var(--accent);font-size:15px;font-weight:600;letter-spacing:-.24px;white-space:nowrap;flex:none}
.pill svg{width:15px;height:15px}
.pill.red{background:rgba(255,59,48,.14);color:var(--red)}
.tb{color:var(--accent);font-size:17px;min-height:44px;padding:0 8px;white-space:nowrap}
.tb.strong{font-weight:600}
.tb.red{color:var(--red)}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Segmentreglage */
.segc{display:flex;margin:12px 16px 0;padding:2px;height:32px;border-radius:9px;background:var(--fill)}
.segc button{flex:1;text-align:center;border-radius:7px;font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.08px;color:var(--ink);position:relative}
.segc button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.segc button:active{opacity:1}

/* Filterkapslar */
.fchips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 16px;margin-top:16px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;height:32px;border-radius:16px;padding:0 14px;font-size:15px;font-weight:500;letter-spacing:-.24px;background:var(--fill);color:var(--ink);white-space:nowrap}
.fchips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* Statistikrutor */
.stats{display:grid;gap:10px;margin:12px 16px 0;grid-template-columns:repeat(3,minmax(0,1fr))}
.stats.s4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.stats.s4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.stat .fn{display:block}
.stat b{display:block;font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thin{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:8px}
.thin>i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.thin.warn>i{background:var(--orange)}
.thin.bad>i{background:var(--red)}

/* Hopfällbara sektioner */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
summary.sh{align-items:center}
summary.sh::after{content:"";width:8px;height:8px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(-45deg);margin:0 4px 3px 0;transition:transform .2s}
details[open]>summary.sh::after{transform:rotate(45deg);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){summary.sh::after{transition:none}}

/* ===== 6. Översikt: widgets ===== */
.clock{display:none;font-size:64px;line-height:1;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;padding:4px 16px 8px}
body.wall .clock{display:block}
@media (min-width:900px){.clock{display:block}}
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 16px 0}
@media (min-width:900px){.widgets{grid-template-columns:repeat(4,minmax(0,1fr))}}
body.wall .widgets{grid-template-columns:repeat(4,minmax(0,1fr))}
.widget{background:var(--surface);border-radius:20px;padding:14px 16px;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.widget.w2{grid-column:span 2}
.wh{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.08px;color:var(--accent);min-height:20px}
.wh svg{width:16px;height:16px}
.wh .r{margin-left:auto;color:var(--ink-2);font-weight:400}
.wbig{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;font-variant-numeric:tabular-nums}
.wbig small{font-size:22px;color:var(--ink-2);font-weight:700}
.wl{display:flex;flex-direction:column}
.wl .cell{padding:8px 0;min-height:40px}
.wl .cell+.cell::before{left:0}
.wl .cell.ck::before{left:36px!important}
.wmeal{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;padding:6px 0;position:relative}
.wmeal+.wmeal{border-top:.5px solid var(--line);padding-top:10px}
.wmeal .top{display:flex;align-items:center;gap:8px}
.wmeal .top .val{margin-left:auto;font-size:15px}
.ev{display:flex;gap:8px;font-size:15px;line-height:20px;letter-spacing:-.24px;padding:3px 0}
.ev .t{width:92px;flex:none;white-space:nowrap;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:15px}
.wempty{color:var(--ink-2);font-size:15px;letter-spacing:-.24px}

/* Rumsstatus */
.room{display:flex;align-items:center;gap:12px}
.room .grow>div:first-child{overflow-wrap:anywhere}
.cap{height:4px;border-radius:2px;margin-top:6px;background:var(--fill);overflow:hidden}
.cap>i{display:block;height:100%;border-radius:2px;background:var(--green)}
.cap.warn>i{background:var(--orange)}
.cap.bad>i{background:var(--red)}
.hw{font-size:15px;font-weight:600;letter-spacing:-.24px;color:var(--green);white-space:nowrap}
.hw.warn{color:var(--orange)}
.hw.bad{color:var(--red)}

/* ===== 7. Mat ===== */
.meal-cell .chips-row{margin-bottom:3px}
.rcp-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.rcp-facts>div{padding:10px 6px;position:relative;min-width:0}
.rcp-facts>div+div::before{content:"";position:absolute;left:0;top:10px;bottom:10px;border-left:.5px solid var(--line)}
.rcp-facts .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rcp-top{padding:0 16px}
.rcp-top .chips-row{margin:8px 0 6px}
.recipe{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.recipe{grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:0}}
.stepper{display:inline-flex;align-items:center;height:32px;border-radius:16px;background:var(--fill);text-transform:none;color:var(--ink);overflow:hidden}
.stepper button{width:32px;height:32px;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--accent)}
.stepper span{padding:0 6px;font-size:15px;font-weight:600;letter-spacing:-.24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sh.with-ctl{align-items:center;padding-bottom:8px}
.ingx{position:relative;display:flex;gap:10px;padding:11px 16px;font-size:17px}
.ingx .q{width:90px;flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.ingx .n{min-width:0;overflow-wrap:anywhere}
.ingx.hit{background:var(--accent-soft);color:var(--accent)}
.steps{margin:0;padding:0;list-style:none}
.steps>li{position:relative;display:flex;gap:12px;padding:12px 16px;cursor:pointer}
.steps>li+li::before{content:"";position:absolute;top:0;left:54px;right:0;border-top:.5px solid var(--line)}
.steps>li:active{opacity:1}
.steps .no{width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.steps>li.active{background:var(--accent-soft)}
.steps>li.active .no{background:var(--accent);color:var(--on-accent)}
.steps .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.steps .pills{margin-top:8px}
.now{background:var(--surface);border-radius:10px;margin-top:10px;overflow:hidden}
.now .fn{padding:8px 12px 2px;text-transform:uppercase}
.now .ingx{padding:8px 12px}
.now .ingx+.ingx::before{content:"";position:absolute;top:0;left:12px;right:0;border-top:.5px solid var(--line)}
.uses{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:8px}
.uses span{font-size:12px;line-height:16px;font-weight:600;letter-spacing:0;background:var(--fill);color:var(--ink-2);border-radius:6px;padding:2px 7px}
.note{padding:11px 16px;font-size:17px}

/* Reglaget (UISlider) för dagens ork */
.ork-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ork-body{padding:4px 16px 10px}
.ork-track{position:relative;height:44px;display:flex;align-items:center;--pos:50%}
.ork-track::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:linear-gradient(to right,var(--accent) 0 var(--pos),var(--track) var(--pos) 100%)}
.ork-track input{position:relative;z-index:1;width:100%;margin:0;height:44px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:pan-y}
.ork-track input::-webkit-slider-runnable-track{height:44px;background:transparent}
.ork-track input::-moz-range-track{height:44px;background:transparent}
.ork-track input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:8px;border-radius:50%;background:#fff;border:0;box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)}
